[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-flight-intelligence"
version = "0.1.0"
description = "A documented data engineering and analytics project for Indian airport activity."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "tenacity>=8.2,<10.0",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2,<4.0", "sqlalchemy>=2.0,<3.0"]
analytics = ["pandas>=2.2,<3.0", "pyarrow>=16,<25"]
dev = ["pytest>=8.2,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.5,<1.0", "mypy>=1.10,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
